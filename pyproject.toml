[project]
name = "paperlaas-translate"
version = "0.1.0"
description = "Paperless-ngx translation webhook service"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116.1,<1.0.0",
  "httpx>=0.28.1,<1.0.0",
  "openai>=1.109.1,<2.0.0",
  "pdf2zh-next==2.8.2",
  "pydantic-settings>=2.13.1,<3.0.0",
  "python-docx>=1.2.0,<2.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "structlog>=25.4.0,<26.0.0",
  "tenacity>=9.1.2,<10.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.2,<9.0.0",
  "pytest-asyncio>=1.2.0,<2.0.0",
  "respx>=0.22.0,<1.0.0",
]

[project.scripts]
paperlaas-translate = "paperlaas_translate.main:run"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperlaas_translate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
